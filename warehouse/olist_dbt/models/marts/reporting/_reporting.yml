version: 2

models:
  - name: mart_seller_perf
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_seller')
                field: seller_id

  - name: mart_delivery_delay_stages
    columns:
      - name: stage
        tests:
          - not_null
          - unique
          - dbt_expectations.expect_column_values_to_be_in_set:
              arguments:
                value_set: ['approval', 'seller_handling', 'transit']
      - name: pct_of_delay
        tests:
          - not_null

  - name: mart_transit_drivers
    description: >
      Transit time cut by observable order shape and seller-to-customer distance. Does NOT
      classify fulfilment type: Olist has no warehouse, carrier or per-item delivery field,
      so consolidation / direct / dropship are not observable and no such column is exposed.
      Headline: distance dominates (~4x across distance bands vs ~1.5x across order shapes).

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_shape
              - distance_band
    columns:
      - name: order_shape
        description: >
          Seller count plus handoff speed. A measured property of the order, not a routing
          or fulfilment-strategy claim.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_in_set:
              arguments:
                value_set: ['multi_seller', 'single_seller_slow_handoff', 'single_seller_normal_handoff', 'unclassified']
      - name: distance_band
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_in_set:
              arguments:
                value_set: ['1. same_city', '2. same_state', '3. cross_state', '4. unknown']
      - name: order_count
        tests:
          - not_null

  - name: mart_transit_unclassified
    description: >
      Why orders are unclassified in mart_transit_drivers, by distance band, reason and
      order status.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - distance_band
              - unclassified_reason
              - order_status
    columns:
      - name: unclassified_reason
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_in_set:
              arguments:
                value_set: ['no_items_on_order', 'never_approved_or_shipped', 'approval_timestamp_missing', 'never_handed_to_carrier']
      - name: order_count
        tests:
          - not_null

  - name: mart_pdt_delivery
    columns:
      - name: product_category_buckets
        tests:
          - not_null
      - name: product_size_buckets
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_in_set:
              arguments:
                value_set: ['S', 'M', 'L', 'XL']

  - name: mart_seller_performance
    description: >
      Seller-level performance metrics for Business Question 1.
      Grain: one row per seller.

    columns:
      - name: seller_id
        description: "Unique identifier for the seller."
        data_tests:
          - not_null
          - unique

      - name: late_shipping_pct
        description: >
          Percentage of shipped order items handed to the carrier
          after the seller's shipping limit date.
          NULL means there were no qualifying shipped items
          for which this percentage could be calculated.

      - name: late_delivery_pct
        description: >
          Percentage of delivered orders involving the seller
          that were delivered late.
        data_tests:
          - not_null
