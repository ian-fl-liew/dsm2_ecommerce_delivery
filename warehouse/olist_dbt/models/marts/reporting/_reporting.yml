version: 2

models:
  - name: mart_seller_perf
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_seller')
                field: seller_id

  - name: mart_delivery_delay_stages
    columns:
      - name: stage
        tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values:
                  - approval
                  - seller_handling
                  - transit
      - name: pct_of_delay
        tests:
          - not_null