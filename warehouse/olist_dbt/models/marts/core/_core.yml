version: 2

models:
  - name: dim_customer
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: dim_date
    columns:
      - name: date_key
        tests:
          - unique
          - not_null

  - name: dim_products
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: dim_seller
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null

  - name: dim_geolocation
    columns:
      - name: zip_code_prefix
        tests:
          - unique
          - not_null

  - name: fact_orders
    description: >
      Grain: 1 row per order line item (order_id + order_item_id). Orders with no item
      rows are preserved with a null order_item_id. Delivery-stage and order-rollup
      measures are order-level and repeat across the order's items -- filter
      is_order_header_row before aggregating them.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - order_item_id
    columns:
      - name: order_id
        tests:
          - not_null
      - name: is_order_header_row
        description: >
          True on exactly one row per order. Filtering on it reproduces the old order
          grain 1:1, which is what every order-level aggregation needs.
        tests:
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: seller_id
        description: Null only for the 775 orders that carry no item rows.
        tests:
          - relationships:
              arguments:
                to: ref('dim_seller')
                field: seller_id
      - name: product_id
        description: Null only for the 775 orders that carry no item rows.
        tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: delivery_status
        tests:
          - accepted_values:
              arguments:
                values:
                  - early
                  - on_time
                  - late_1_3_days
                  - late_4_7_days
                  - late_8_plus_days
                  - not_delivered
