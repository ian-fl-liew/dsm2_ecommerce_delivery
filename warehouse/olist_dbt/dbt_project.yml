name: 'olist_dbt'
version: '1.0.0'
config-version: 2

profile: 'olist_dbt'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  olist_dbt:
    # staging + intermediate + marts/core all share one dataset (olist_warehouse) -- same
    # owners (the 3 dbt developers), no reason for separate access boundaries between them.
    # Distinguished by naming convention (stg_*, int_*, dim_*/fact_*), not dataset.
    # marts/reporting stays its own dataset: the one real governance boundary, since the
    # dashboard is scoped to read-only access there and nowhere else.
    staging:
      +materialized: view
      +schema: warehouse
    intermediate:
      +materialized: view
      +schema: warehouse
    marts:
      core:
        +materialized: table
        +schema: warehouse
      reporting:
        +materialized: table
        +schema: reporting
